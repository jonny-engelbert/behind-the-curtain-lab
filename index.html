<title>Behind the Curtain Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lab notebook. Course map in a left rail (top strip on phones); each unit is one long page:
   Fried's case -> the lab -> the probe -> checks -> notebook. Claim labels mark the status of every claim. */
:root{
  --paper:#F1F3F0; --panel:#FFFFFF; --panel-2:#F7F8F6; --ink:#17212A; --muted:#58646D; --rule:#D3D9D5;
  --accent:#1D6B74; --accent-ink:#FFFFFF; --accent-soft:#DCECEC;
  --est:#2B7449; --est-bg:#E2F1E7; --interp:#6A4C9C; --interp-bg:#ECE6F6;
  --prop:#A35F00; --prop-bg:#FBEBD2; --open:#9C3556; --open-bg:#F7E2E9;
  --good:#2B7449; --bad:#B3402F;
  --plot-grid:#E1E6E3; --plot-line:#1D6B74; --plot-2:#A35F00; --plot-3:#6A4C9C;
  --font-display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11171B; --panel:#192127; --panel-2:#1F2830; --ink:#E4EAEE; --muted:#9AA7B0; --rule:#2E3A42;
  --accent:#58B3BC; --accent-ink:#0D1417; --accent-soft:#1F3A3E;
  --est:#6CC08E; --est-bg:#1C3326; --interp:#B49BE0; --interp-bg:#2A2340; --prop:#E7A64A; --prop-bg:#3A2A12; --open:#E98AA8; --open-bg:#3A1E29;
  --good:#6CC08E; --bad:#EE8370; --plot-grid:#28333A; --plot-line:#58B3BC; --plot-2:#E7A64A; --plot-3:#B49BE0;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11171B; --panel:#192127; --panel-2:#1F2830; --ink:#E4EAEE; --muted:#9AA7B0; --rule:#2E3A42;
  --accent:#58B3BC; --accent-ink:#0D1417; --accent-soft:#1F3A3E;
  --est:#6CC08E; --est-bg:#1C3326; --interp:#B49BE0; --interp-bg:#2A2340; --prop:#E7A64A; --prop-bg:#3A2A12; --open:#E98AA8; --open-bg:#3A1E29;
  --good:#6CC08E; --bad:#EE8370; --plot-grid:#28333A; --plot-line:#58B3BC; --plot-2:#E7A64A; --plot-3:#B49BE0;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.4vw,3rem);letter-spacing:-.01em}
h2{font-size:1.65rem;margin-top:.2rem}
h3{font-size:1.25rem}
p{margin:0}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-block:28px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px}
.brand .eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand .name{font-family:var(--font-display);font-size:1.5rem;line-height:1.15;margin-top:4px}
.map{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:u}
.map a{display:grid;grid-template-columns:28px 1fr 14px;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:8px;font-size:.93rem;line-height:1.3}
.map a .n{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.map a .done{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule);align-self:center}
.map a.is-done .done{background:var(--est);border-color:var(--est)}
.map a:hover{background:var(--panel-2)}
.map a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.map a[aria-current="page"] .n{color:var(--accent-ink);opacity:.8}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
.legend .claim{font-size:.72rem}
main{min-width:0}
.unit-head{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.unit-head .meta{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:6px 18px}
.unit-head .lede{font-size:1.08rem;max-width:68ch;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:18px}
.section{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.section > .kicker{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:12px}
.claim{display:inline-block;font-family:var(--font-mono);font-size:.7rem;font-weight:500;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:2px}
.c-est{color:var(--est);background:var(--est-bg)} .c-interp{color:var(--interp);background:var(--interp-bg)}
.c-prop{color:var(--prop);background:var(--prop-bg)} .c-open{color:var(--open);background:var(--open-bg)}
.claim-block{border-left:3px solid var(--rule);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.claim-block.k-est{border-color:var(--est)} .claim-block.k-interp{border-color:var(--interp)}
.claim-block.k-prop{border-color:var(--prop)} .claim-block.k-open{border-color:var(--open)}
.claim-block > .claim{align-self:flex-start}
main:focus{outline:none}
.claim-block .why{font-size:.86rem;color:var(--muted)}
blockquote{margin:0;font-family:var(--font-display);font-size:1.18rem;line-height:1.45;font-style:italic;max-width:62ch}
blockquote cite{display:block;font-family:var(--font-mono);font-style:normal;font-size:.75rem;color:var(--muted);margin-top:4px}
.case{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.case h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;max-width:70ch}
.lab{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:20px}
.lab.single{grid-template-columns:minmax(0,1fr)}
.lab .viz{min-width:0;display:flex;flex-direction:column;gap:10px}
.lab .controls{min-width:0;display:flex;flex-direction:column;gap:14px}
.lab .model-note{grid-column:1/-1;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--rule);padding-top:10px}
canvas.plot{width:100%;height:280px;display:block;background:var(--panel-2);border-radius:8px}
canvas.plot.tall{height:340px}
svg.fig{width:100%;height:auto;display:block}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label{font-size:.88rem;display:flex;justify-content:space-between;gap:10px}
.ctl output{font-family:var(--font-mono);font-size:.84rem;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-family:var(--font-mono);font-size:.84rem;background:var(--panel-2);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.readout dt{color:var(--muted)} .readout dd{margin:0;text-align:right}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.check{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:12px;max-width:820px}
.check .q{font-weight:500}
.check .opts{display:flex;flex-direction:column;gap:8px}
.check .opt{text-align:left;font:inherit;font-size:.95rem;border:1px solid var(--rule);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:10px 12px;cursor:pointer}
.check .opt:hover{border-color:var(--accent)}
.check .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check .opt.right{border-color:var(--good)} .check .opt.wrong{border-color:var(--bad)}
.check .fb{font-size:.93rem;border-radius:8px;padding:10px 12px;background:var(--panel-2)}
.check .fb.ok{border-left:3px solid var(--good)} .check .fb.no{border-left:3px solid var(--bad)}
.check .fb strong{display:block;margin-bottom:2px}
textarea{font:inherit;font-size:.95rem;width:100%;min-height:84px;border:1px solid var(--rule);border-radius:8px;background:var(--panel-2);color:var(--ink);padding:10px 12px;resize:vertical}
.note{display:flex;flex-direction:column;gap:6px;max-width:820px}
.note label{font-weight:500;font-size:.95rem}
.note .hint{font-size:.84rem;color:var(--muted)}
.note .saved{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.sorter{display:flex;flex-direction:column;gap:8px}
.sort-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.sort-item select{font:inherit;font-size:.86rem;padding:5px 6px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);max-width:180px}
.sort-item.right{border-color:var(--good)} .sort-item.wrong{border-color:var(--bad)}
.sort-item .fbline{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.pager a{text-decoration:none;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0}
.pager a small{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.pager a:hover{border-color:var(--accent)}
.pager .next{margin-left:auto;text-align:right}
.mono{font-family:var(--font-mono);font-size:.9em}
.small{font-size:.86rem;color:var(--muted)}
.callout{background:var(--panel-2);border-radius:var(--radius);padding:14px 16px;max-width:72ch;font-size:.95rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:.9rem;min-width:520px;width:100%}
th,td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
th{font-weight:600;font-size:.82rem;color:var(--muted)}
.ladder-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rung{border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--panel-2);display:flex;flex-direction:column;gap:4px;min-height:96px;transition:opacity .2s, border-color .2s}
.rung b{font-family:var(--font-mono);font-size:.82rem}
.rung span{font-size:.84rem;color:var(--muted)}
.rung.dim{opacity:.32}
.rung.lit{border-color:var(--accent);background:var(--accent-soft)}
.rung.stab{border-color:var(--prop);background:var(--prop-bg)}
.rung.end{border-style:dashed}
.proof-line{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--panel-2);font-family:var(--font-mono);font-size:.9rem;cursor:pointer;border:1px solid transparent;text-align:left;color:var(--ink);width:100%}
.proof-line[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.proof-line .src{font-family:var(--font-body);font-size:.78rem;color:var(--muted)}
.proof-line.goal{border-color:var(--good)}
.chip{font-family:var(--font-mono);font-size:.78rem;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--muted)}
.big{font-family:var(--font-display);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:8px;background:var(--panel-2)}
.stat small{font-size:.8rem;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit-card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px}
.unit-card:hover{border-color:var(--accent)}
.unit-card .n{font-family:var(--font-mono);font-size:.74rem;color:var(--muted)}
.unit-card h3{font-size:1.12rem}
.unit-card p{font-size:.88rem;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mobile-map{display:none}
@media (max-width: 960px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 48px}
  .rail{position:static}
  .rail .map,.rail .legend{display:none}
  .mobile-map{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -4px}
  .mobile-map a{flex:0 0 auto;font-size:.82rem;text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:5px 11px;background:var(--panel)}
  .mobile-map a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .lab{grid-template-columns:minmax(0,1fr)}
  .ladder-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 560px){ .two,.home-grid{grid-template-columns:minmax(0,1fr)} canvas.plot{height:230px} .case{padding:16px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="shell">
  <aside class="rail" aria-label="Course map">
    <div class="brand">
      <div class="eyebrow">A course on H. Michael Fried's book</div>
      <div class="name">Behind the Curtain Lab</div>
    </div>
    <nav class="mobile-map" id="mobileMap" aria-label="Units"></nav>
    <ol class="map" id="map"></ol>
    <div class="legend" aria-label="Claim labels">
      <div>Every claim carries its status:</div>
      <div><span class="claim c-est">Established</span> tested physics or logic</div>
      <div><span class="claim c-interp">Interpretation</span> a reading of established results</div>
      <div><span class="claim c-prop">Fried's proposal</span> new to this book</div>
      <div><span class="claim c-open">Open question</span> says what is open</div>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
/* ---------- core ---------- */
window.LAB = (function(){
  const units = [];
  const KEY = 'btc-lab-v1';
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ store = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
  const get = (k, d) => (k in store ? store[k] : d);
  const set = (k, v) => { store[k] = v; save(); };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const LABELS = {est:'Established', interp:'Interpretation', prop:"Fried's proposal", open:'Open question'};
  const tag = (k, text) => `<span class="claim c-${k}">${text || LABELS[k]}</span>`;
  // a claim block: kind, html body, optional note on why it carries this label
  const claim = (k, body, why) => `<div class="claim-block k-${k}">${tag(k)}<div>${body}</div>${why ? `<div class="why">${why}</div>` : ''}</div>`;
  const quote = (text, page) => `<blockquote>“${text}”<cite>Fried, p. ${page}</cite></blockquote>`;
  const slider = (id, label, min, max, step, value) =>
    `<div class="ctl"><label for="${id}"><span>${label}</span><output id="${id}-out"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}"></div>`;
  const note = (id, label, hint) => `<div class="note"><label for="nb-${id}">${label}</label>${hint ? `<div class="hint">${hint}</div>` : ''}<textarea id="nb-${id}" data-note="${id}"></textarea><div class="saved" aria-live="polite" id="nb-${id}-s"></div></div>`;

  // multiple-choice check with explanatory feedback for every option
  const checks = {};
  function check(id, q, opts, opt2){
    checks[id] = opts;
    const reason = opt2 && opt2.reason;
    return `<div class="check" id="ck-${id}"><div class="q">${q}</div>
      ${reason ? `<div class="note"><label for="ckr-${id}" class="small">Before choosing, write your reason in a sentence.</label><textarea id="ckr-${id}" data-note="ck-${id}" style="min-height:60px"></textarea></div>` : ''}
      <div class="opts" role="group" aria-label="Answer options">${opts.map((o,i)=>`<button class="opt" type="button" data-ck="${id}" data-i="${i}" aria-pressed="false">${o.t}</button>`).join('')}</div>
      <div class="fb" id="ckf-${id}" aria-live="polite" hidden></div></div>`;
  }
  function wireChecks(root){
    root.querySelectorAll('.opt[data-ck]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.ck, i = +b.dataset.i, o = checks[id][i];
      const box = root.querySelector('#ck-'+id);
      box.querySelectorAll('.opt').forEach(x => { x.setAttribute('aria-pressed', x===b ? 'true':'false'); x.classList.remove('right','wrong'); });
      b.classList.add(o.ok ? 'right' : 'wrong');
      const fb = box.querySelector('#ckf-'+id); fb.hidden = false;
      fb.className = 'fb ' + (o.ok ? 'ok' : 'no');
      fb.innerHTML = `<strong>${o.ok ? 'Yes.' : 'Not quite.'}</strong>${o.fb}`;
      const res = get('checks', {}); res[id] = o.ok; set('checks', res);
    }));
  }
  function wireNotes(root){
    root.querySelectorAll('textarea[data-note]').forEach(t => {
      const k = 'note:' + t.dataset.note; t.value = get(k, '');
      let tm; t.addEventListener('input', () => { set(k, t.value); clearTimeout(tm);
        const s = root.querySelector('#'+t.id+'-s'); if (s){ s.textContent = 'Saved in this browser'; tm = setTimeout(()=>s.textContent='', 1400); } });
    });
  }
  // slider wiring: fmt(value) -> string; onInput(value)
  function bindSlider(root, id, fmt, on){
    const el = root.querySelector('#'+id), out = root.querySelector('#'+id+'-out');
    const upd = () => { const v = parseFloat(el.value); out.textContent = fmt(v); on && on(v); };
    el.addEventListener('input', upd); upd(); return el;
  }
  // canvas helper with DPR and theme colors
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function canvas(el, draw){
    const ctx = el.getContext('2d');
    function render(){ const r = el.getBoundingClientRect(); const d = window.devicePixelRatio || 1;
      if (!r.width) return; el.width = Math.round(r.width*d); el.height = Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0);
      draw(ctx, r.width, r.height, { ink: cssVar('--ink'), muted: cssVar('--muted'), grid: cssVar('--plot-grid'), line: cssVar('--plot-line'), c2: cssVar('--plot-2'), c3: cssVar('--plot-3'), good: cssVar('--good'), bad: cssVar('--bad'), panel: cssVar('--panel-2'), font: cssVar('--font-mono') }); }
    const ro = new ResizeObserver(render); ro.observe(el);
    const mq = matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', render);
    LAB._cleanup.push(() => ro.disconnect());
    render(); return render;
  }
  // axes helper: returns mapping fns
  function axes(ctx, W, H, c, o){
    const m = Object.assign({l:46, r:14, t:14, b:34}, o.m || {});
    const X = x => m.l + (x - o.x0) / (o.x1 - o.x0) * (W - m.l - m.r);
    const Y = y => H - m.b - (y - o.y0) / (o.y1 - o.y0) * (H - m.t - m.b);
    ctx.font = `11px ${c.font}`; ctx.lineWidth = 1;
    (o.xt || []).forEach(t => { ctx.strokeStyle = c.grid; ctx.beginPath(); ctx.moveTo(X(t), m.t); ctx.lineTo(X(t), H - m.b); ctx.stroke();
      ctx.fillStyle = c.muted; ctx.textAlign = 'center'; ctx.fillText(o.xf ? o.xf(t) : t, X(t), H - m.b + 16); });
    (o.yt || []).forEach(t => { ctx.strokeStyle = c.grid; ctx.beginPath(); ctx.moveTo(m.l, Y(t)); ctx.lineTo(W - m.r, Y(t)); ctx.stroke();
      ctx.fillStyle = c.muted; ctx.textAlign = 'right'; ctx.fillText(o.yf ? o.yf(t) : t, m.l - 6, Y(t) + 4); });
    if (o.xl){ ctx.fillStyle = c.muted; ctx.textAlign = 'right'; ctx.fillText(o.xl, W - m.r, H - 4); }
    if (o.yl){ ctx.save(); ctx.fillStyle = c.muted; ctx.textAlign = 'left'; ctx.fillText(o.yl, m.l + 4, m.t + 10); ctx.restore(); }
    return {X, Y, m};
  }
  // seeded RNG so samples are reproducible per click
  function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) / 4294967296); }; }

  function sorter(id, items, cats){
    return `<div class="sorter" id="so-${id}">${items.map((it,i)=>`<div class="sort-item" data-i="${i}"><div>${it.t}</div>
      <select aria-label="Category for: ${esc(it.t.replace(/<[^>]+>/g,''))}"><option value="">Choose…</option>${cats.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select>
      <div class="fbline" hidden></div></div>`).join('')}
      <div class="row"><button class="btn primary" type="button" data-sorter="${id}">Check my sorting</button><span class="small" id="so-${id}-r" aria-live="polite"></span></div></div>`;
  }
  function wireSorter(root, id, items){
    const box = root.querySelector('#so-'+id); if (!box) return;
    box.querySelector('[data-sorter]').addEventListener('click', () => {
      let n = 0;
      box.querySelectorAll('.sort-item').forEach(row => { const it = items[+row.dataset.i]; const v = row.querySelector('select').value;
        const ok = v === it.a; if (ok) n++; row.classList.toggle('right', ok); row.classList.toggle('wrong', !ok && v !== '');
        const fl = row.querySelector('.fbline'); fl.hidden = !v; fl.innerHTML = v ? (ok ? '✓ ' : '✗ ') + it.fb : ''; });
      box.querySelector('#so-'+id+'-r').textContent = `${n} of ${items.length} match the answer key. Read the note under each.`;
    });
  }

  function markDone(id){ const d = get('done', {}); d[id] = true; set('done', d); renderMap(); }
  function renderMap(){
    const cur = location.hash.slice(1) || 'start', done = get('done', {});
    document.getElementById('map').innerHTML = units.map(u =>
      `<li><a href="#${u.id}" ${u.id===cur?'aria-current="page"':''} class="${done[u.id]?'is-done':''}"><span class="n">${u.num}</span><span>${u.short}</span><span class="done" aria-label="${done[u.id]?'visited':''}"></span></a></li>`).join('');
    document.getElementById('mobileMap').innerHTML = units.map(u =>
      `<a href="#${u.id}" ${u.id===cur?'aria-current="page"':''}>${u.num} ${u.short}</a>`).join('');
    const a = document.querySelector('#mobileMap a[aria-current]'); a && a.scrollIntoView({block:'nearest', inline:'center'});
  }
  const _cleanup = [];
  function route(){
    while (_cleanup.length) { try { _cleanup.pop()(); } catch(e){} }
    const id = location.hash.slice(1) || 'start';
    const i = Math.max(0, units.findIndex(u => u.id === id)); const u = units[i];
    const main = document.getElementById('main');
    const prev = units[i-1], next = units[i+1];
    main.innerHTML = `<header class="unit-head"><div class="meta"><span>${u.num === '0' ? 'Start here' : 'Unit '+u.num+' of '+(units.length-1)}</span><span>${u.minutes}</span>${u.pages?`<span>Book: ${u.pages}</span>`:''}</div>
      <h1>${u.title}</h1><p class="lede">${u.lede}</p></header>
      <div class="stack" id="unitBody">${u.html()}</div>
      <nav class="pager" aria-label="Unit navigation">${prev?`<a href="#${prev.id}"><small>← Previous</small>${prev.short}</a>`:''}${next?`<a class="next" href="#${next.id}"><small>Next →</small>${next.short}</a>`:''}</nav>`;
    const body = main.querySelector('#unitBody');
    wireChecks(body); wireNotes(body);
    u.mount && u.mount(body);
    markDone(u.id);
    document.title = (u.num==='0' ? '' : u.short + ' · ') + 'Behind the Curtain Lab';
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', () => { route(); document.getElementById('main').focus({preventScroll:true}); });
  return { units, tag, claim, quote, slider, note, check, sorter, wireSorter, bindSlider, canvas, axes, rng, get, set, esc, route, renderMap, _cleanup,
    add(u){ units.push(u); } };
})();
